name: CI

# Every push and pull request is tested on Windows, Linux and macOS, and the Windows release exe is built and checked to be one file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux window libraries
        if: runner.os == 'Linux'
        shell: bash
        run: ./packaging/linux/install-build-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Server-only build (no window, no system libraries)
        run: cargo build --no-default-features --features scrape
      - name: Offline build (no network code)
        run: cargo build --no-default-features
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.mjs"

  windows-exe:
    # The real Windows release exe, checked to be one file, kept as a download for testing.
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - shell: pwsh
        run: ./packaging/windows/check-exe.ps1 target/release/gamenight.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-windows-exe
          path: target/release/gamenight.exe
