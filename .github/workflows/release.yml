name: Release

# Push a tag like v1.0.0 to build every platform and draft a GitHub release with the files attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, args: "" }
          - { name: linux-x86_64, os: ubuntu-22.04, args: "" }
          - { name: linux-x86_64-headless, os: ubuntu-22.04, args: "--no-default-features --features scrape" }
          - { name: macos-aarch64, os: macos-latest, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux window libraries
        if: runner.os == 'Linux' && matrix.args == ''
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - run: cargo test ${{ matrix.args }}
      - run: cargo build --release ${{ matrix.args }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/gamenight.exe dist/
          $loader = Get-ChildItem target/release -Recurse -Filter WebView2Loader.dll | Where-Object FullName -like '*x64*' | Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName dist/ }   # shipped beside the exe in case this build loads it dynamically
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath gamenight-${{ matrix.name }}.zip
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/gamenight README.md LICENSE CHANGELOG.md dist/
          tar -czf gamenight-${{ matrix.name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-${{ matrix.name }}
          path: gamenight-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum gamenight-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
