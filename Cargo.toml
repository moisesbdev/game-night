[package]
name = "gamenight"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Pick what to play tonight, for couples and friends: a fair, explainable game picker with Steam library import, a journal of your nights and controller support."
license = "MIT"
readme = "README.md"
keywords = ["games", "picker", "couch-coop", "steam", "party"]
categories = ["games"]
exclude = ["/.github", "/docs/screenshots"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = { version = "0.37.1", optional = true }
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["json"], optional = true }
wry = { version = "0.57.0", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, optional = true }

[features]
default = ["window", "scrape"]
window = ["dep:wry", "dep:tao", "dep:rfd"]
scrape = ["dep:ureq"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[build-dependencies]
winresource = "0.1.34"

# `cargo deb` builds a Debian/Ubuntu package that pulls in the one system library the window needs (WebKitGTK).
[package.metadata.deb]
maintainer = "The Game Night contributors"
section = "games"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libgtk-3-0"
recommends = "zenity"
extended-description = "Picks what to play tonight for couples and friends: a fair, explainable draw from your Steam, ES-DE, Epic, GOG, RetroArch, Heroic and Lutris games, with a journal of your nights and controller support. Runs locally; no account."
assets = [
    ["target/release/gamenight", "usr/bin/", "755"],
    ["packaging/linux/game-night.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/game-night.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/gamenight/README.md", "644"],
]
